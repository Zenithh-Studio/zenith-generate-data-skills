name: Validate Zenith Skills
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate demo package
        run: node scripts/zenith-data.mjs validate examples/napoleon-mini.json
      - name: Run deterministic validation tests
        run: node --test tests/*.test.mjs
      - name: Export seven-tab workbook
        run: node scripts/zenith-data.mjs export examples/napoleon-mini.json --out dist/demo
      - name: Check export manifest
        run: node -e "const f=require('./dist/demo/manifest.json'); if(f.tabs.length!==7)process.exit(1)"
